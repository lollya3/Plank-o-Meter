<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Plank-o-Meter</title>

  <!-- ============================================
       STYLES
       ============================================ -->
  <style>
    /* ---- Base ---- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 60px;
    }

    /* ---- Theme: Cool blue-green ---- */
    body {
      --bg: #16191F;
      --card-bg: #22262E;
      --text: #F0F4F8;
      --text-muted: #9AA5B1;
      --primary: #4FE0CB;
      --primary-text: #16191F;
      --accent: #7DD3F0;
      --secondary: #2C313A;
      --border: #3A4049;
      --danger: #FF6B6B;
    }

    /* ---- Header ---- */
    .app-header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 8px;
    }

    .app-header h1 {
      font-size: 30px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    /* ---- Cards ---- */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    /* ---- Collapsible section ---- */
    .collapsible-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .collapsible-header h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .collapsible-arrow {
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .collapsible-arrow.open {
      transform: rotate(180deg);
    }

    .collapsible-body {
      display: none;
      margin-top: 14px;
    }

    .collapsible-body.open {
      display: block;
    }

    /* ---- Exercise list ---- */
    .exercise-list {
      list-style: none;
      margin-bottom: 14px;
    }

    .exercise-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .exercise-item:last-child {
      border-bottom: none;
    }

    .exercise-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .exercise-name {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
    }

    .exercise-name-input {
      flex: 1;
      background: var(--secondary);
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 15px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 6px;
    }

    .icon-btn.danger {
      color: var(--danger);
    }

    .icon-btn.confirm {
      color: var(--primary);
    }

    /* ---- Add exercise row ---- */
    .add-exercise-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .add-exercise-row input {
      flex: 1;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 15px;
    }

    .add-exercise-row input::placeholder {
      color: var(--text-muted);
    }

    .add-exercise-row input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .add-btn {
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }

    /* ---- Placeholder for future steps ---- */
    .placeholder-card {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 15px;
    }

    .placeholder-card .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* ---- Timer card ---- */
    .exercise-select {
      width: 100%;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 18px;
      -webkit-appearance: none;
      appearance: none;
    }

    .timer-display {
      text-align: center;
      font-size: 56px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--primary);
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .timer-hint {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 18px;
    }

    .timer-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
    }

    .timer-btn.start {
      background: var(--primary);
      color: var(--primary-text);
    }

    .timer-btn.stop {
      background: var(--danger);
      color: #1A1A1D;
    }

    /* ---- Review screen (after stopping timer) ---- */
    .review-duration {
      text-align: center;
      font-size: 48px;
      font-weight: 800;
      color: var(--accent);
      margin: 12px 0 4px;
    }

    .review-edit-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .review-edit-row input {
      width: 90px;
      text-align: center;
      background: var(--secondary);
      border: 1px solid var(--primary);
      border-radius: 10px;
      padding: 10px;
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
    }

    .review-edit-row span {
      color: var(--text-muted);
      font-size: 15px;
    }

    .review-btn-row {
      display: flex;
      gap: 10px;
    }

    .review-btn-row button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .review-btn-row .save-btn {
      background: var(--primary);
      color: var(--primary-text);
    }

    .review-btn-row .edit-btn {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .review-btn-row .discard-btn {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>Plank-o-Meter</h1>
  </header>

  <main>

    <!-- ============================================
         MANAGE EXERCISES (collapsible)
         ============================================ -->
    <div class="card" id="manage-exercises-card">
      <div class="collapsible-header" onclick="toggleManageExercises()">
        <h2>Manage Exercises</h2>
        <span class="collapsible-arrow" id="manage-arrow">▼</span>
      </div>
      <div class="collapsible-body" id="manage-body">
        <ul class="exercise-list" id="exercise-list"></ul>
        <div class="add-exercise-row">
          <input type="text" id="new-exercise-input" placeholder="New exercise name..." maxlength="40">
          <button class="add-btn" onclick="addExercise()">+</button>
        </div>
      </div>
    </div>

    <!-- ============================================
         TIMER
         ============================================ -->
    <div class="card" id="timer-card">

      <!-- Exercise picker -->
      <select class="exercise-select" id="exercise-select" onchange="onExerciseChange()"></select>

      <!-- Idle / running state -->
      <div id="timer-active-view">
        <div class="timer-display" id="timer-display">0.0</div>
        <div class="timer-hint">seconds &mdash; keep this screen open while timing</div>
        <button class="timer-btn start" id="timer-toggle-btn" onclick="toggleTimer()">Start</button>
      </div>

      <!-- Review state (shown after Stop) -->
      <div id="timer-review-view" class="hidden">
        <div class="review-duration" id="review-duration">0.0s</div>
        <div class="review-edit-row hidden" id="review-edit-row">
          <input type="number" id="review-edit-input" step="0.1" min="0">
          <span>seconds</span>
        </div>
        <div class="review-btn-row">
          <button class="discard-btn" onclick="discardSession()">Discard</button>
          <button class="edit-btn" id="review-edit-btn" onclick="toggleEditReview()">Edit</button>
          <button class="save-btn" onclick="saveSession()">Save</button>
        </div>
      </div>
    </div>

    <!-- ============================================
         STATS PLACEHOLDER (future step)
         ============================================ -->
    <div class="card placeholder-card">
      <div class="icon">📊</div>
      Today's best / PB / streak coming soon
    </div>

  </main>

  <!-- ============================================
       DATA MODEL & LOCALSTORAGE LAYER
       ============================================
       All reading/writing to localStorage happens
       through these functions.

       Data shapes:

       exercises: [
         { id: "ex_...", name: "Plank", color: "#hex" }
       ]

       sessions: [
         { id: "s_...", exerciseId: "ex_...", date: "YYYY-MM-DD",
           timestamp: <ms>, duration: <seconds> }
       ]

       personalBests: {
         "<exerciseId>": { duration: <seconds>, date: "YYYY-MM-DD" }
       }

       streaks: {
         overall: { current: 0, longest: 0, lastDate: "YYYY-MM-DD" | null },
         "<exerciseId>": { current: 0, longest: 0, lastDate: "YYYY-MM-DD" | null }
       }
       ============================================ -->
  <script>
    const STORAGE_KEY = "plankometer_data";

    const DEFAULT_EXERCISES = [
      { id: "ex_plank", name: "Plank", color: "#4FE0CB" },
      { id: "ex_wallsit", name: "Wall Sit", color: "#7DD3F0" },
      { id: "ex_hang", name: "Hang", color: "#A78BFA" }
    ];

    const DEFAULT_DATA = {
      exercises: DEFAULT_EXERCISES,
      sessions: [],
      personalBests: {},
      streaks: {
        overall: { current: 0, longest: 0, lastDate: null }
      }
    };

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          saveData(DEFAULT_DATA);
          return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
        const parsed = JSON.parse(raw);
        return {
          exercises: parsed.exercises || DEFAULT_EXERCISES,
          sessions: parsed.sessions || [],
          personalBests: parsed.personalBests || {},
          streaks: parsed.streaks || { overall: { current: 0, longest: 0, lastDate: null } }
        };
      } catch (err) {
        console.error("Failed to load data, using defaults:", err);
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch (err) {
        console.error("Failed to save data:", err);
        alert("Could not save data. Storage may be full.");
        return false;
      }
    }

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function generateId(prefix) {
      return `${prefix}_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
    }

    // ---- Export / Import ----

    function exportData() {
      const data = loadData();
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `plankometer-backup-${getTodayString()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importData(jsonString) {
      try {
        const parsed = JSON.parse(jsonString);
        if (!parsed.exercises || !Array.isArray(parsed.exercises)) {
          throw new Error("Invalid file: missing exercises list");
        }
        if (!parsed.sessions || !Array.isArray(parsed.sessions)) {
          throw new Error("Invalid file: missing sessions list");
        }
        const confirmed = confirm(
          "This will replace ALL current data with the imported file. This cannot be undone. Continue?"
        );
        if (!confirmed) return false;
        saveData({
          exercises: parsed.exercises,
          sessions: parsed.sessions,
          personalBests: parsed.personalBests || {},
          streaks: parsed.streaks || { overall: { current: 0, longest: 0, lastDate: null } }
        });
        return true;
      } catch (err) {
        console.error("Import failed:", err);
        alert("Import failed: " + err.message);
        return false;
      }
    }
  </script>

  <!-- ============================================
       EXERCISE MANAGEMENT
       ============================================ -->
  <script>
    // Color palette — cycles through these for new exercises
    const EXERCISE_COLORS = [
      "#4FE0CB", "#7DD3F0", "#A78BFA", "#F472B6",
      "#FB923C", "#FACC15", "#34D399", "#60A5FA"
    ];

    function toggleManageExercises() {
      const body = document.getElementById("manage-body");
      const arrow = document.getElementById("manage-arrow");
      const isOpen = body.classList.contains("open");
      body.classList.toggle("open", !isOpen);
      arrow.classList.toggle("open", !isOpen);
    }

    function renderExerciseList() {
      const data = loadData();
      const list = document.getElementById("exercise-list");
      list.innerHTML = "";

      data.exercises.forEach(function(ex, index) {
        const li = document.createElement("li");
        li.className = "exercise-item";
        li.id = "exercise-item-" + index;
        li.innerHTML =
          '<div class="exercise-color-dot" style="background:' + ex.color + '"></div>' +
          '<span class="exercise-name">' + ex.name + '</span>' +
          '<button class="icon-btn" onclick="startRenameExercise(' + index + ')">✏️</button>' +
          '<button class="icon-btn danger" onclick="deleteExercise(' + index + ')">🗑️</button>';
        list.appendChild(li);
      });

      renderExerciseDropdown();
    }

    function startRenameExercise(index) {
      const data = loadData();
      const ex = data.exercises[index];
      const item = document.getElementById("exercise-item-" + index);
      item.innerHTML =
        '<div class="exercise-color-dot" style="background:' + ex.color + '"></div>' +
        '<input class="exercise-name-input" id="rename-input-' + index + '" value="' + ex.name + '" maxlength="40">' +
        '<button class="icon-btn confirm" onclick="confirmRenameExercise(' + index + ')">✓</button>' +
        '<button class="icon-btn" onclick="renderExerciseList()">✕</button>';
      const input = document.getElementById("rename-input-" + index);
      input.focus();
      input.select();
    }

    function confirmRenameExercise(index) {
      const input = document.getElementById("rename-input-" + index);
      const newName = input.value.trim();
      if (!newName) {
        alert("Exercise name cannot be empty.");
        return;
      }
      const data = loadData();
      data.exercises[index].name = newName;
      saveData(data);
      renderExerciseList();
    }

    function deleteExercise(index) {
      const data = loadData();
      const ex = data.exercises[index];

      // Check if this exercise has any sessions
      const hasSessions = data.sessions.some(function(s) { return s.exerciseId === ex.id; });
      if (hasSessions) {
        const confirmed = confirm(
          'Delete "' + ex.name + '"? This exercise has logged sessions — they will also be deleted. This cannot be undone.'
        );
        if (!confirmed) return;
      } else {
        const confirmed = confirm('Delete "' + ex.name + '"?');
        if (!confirmed) return;
      }

      // Remove exercise
      data.exercises.splice(index, 1);
      // Remove related sessions
      data.sessions = data.sessions.filter(function(s) { return s.exerciseId !== ex.id; });
      // Remove personal best
      delete data.personalBests[ex.id];
      // Remove streak
      delete data.streaks[ex.id];

      saveData(data);
      renderExerciseList();
    }

    function addExercise() {
      const input = document.getElementById("new-exercise-input");
      const name = input.value.trim();
      if (!name) {
        input.focus();
        return;
      }

      const data = loadData();

      // Check for duplicate name (case-insensitive)
      const duplicate = data.exercises.some(function(ex) {
        return ex.name.toLowerCase() === name.toLowerCase();
      });
      if (duplicate) {
        alert('An exercise called "' + name + '" already exists.');
        return;
      }

      // Pick next color from palette
      const color = EXERCISE_COLORS[data.exercises.length % EXERCISE_COLORS.length];
      const newEx = { id: generateId("ex"), name: name, color: color };
      data.exercises.push(newEx);
      saveData(data);

      input.value = "";
      renderExerciseList();
    }

    // Allow pressing Enter to add exercise
    document.getElementById("new-exercise-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter") addExercise();
    });
  </script>

  <!-- ============================================
       TIMER
       ============================================ -->
  <script>
    const LAST_EXERCISE_KEY = "plankometer_last_exercise";

    let timerRunning = false;
    let timerStartTimestamp = null;   // ms since epoch when Start was tapped
    let timerIntervalId = null;
    let pendingDuration = null;       // seconds, set when Stop is tapped, used by review screen

    function getLastUsedExerciseId() {
      return localStorage.getItem(LAST_EXERCISE_KEY);
    }

    function setLastUsedExerciseId(id) {
      localStorage.setItem(LAST_EXERCISE_KEY, id);
    }

    function renderExerciseDropdown() {
      const data = loadData();
      const select = document.getElementById("exercise-select");
      const lastUsedId = getLastUsedExerciseId();

      select.innerHTML = "";

      if (data.exercises.length === 0) {
        const opt = document.createElement("option");
        opt.textContent = "Add an exercise above to begin";
        opt.disabled = true;
        select.appendChild(opt);
        select.disabled = true;
        return;
      }

      select.disabled = false;
      data.exercises.forEach(function(ex) {
        const opt = document.createElement("option");
        opt.value = ex.id;
        opt.textContent = ex.name;
        select.appendChild(opt);
      });

      // Default to last-used exercise if it still exists, else first in list
      const stillExists = data.exercises.some(function(ex) { return ex.id === lastUsedId; });
      select.value = stillExists ? lastUsedId : data.exercises[0].id;
    }

    function getSelectedExerciseId() {
      return document.getElementById("exercise-select").value;
    }

    function onExerciseChange() {
      setLastUsedExerciseId(getSelectedExerciseId());
    }

    function formatSeconds(totalSeconds) {
      return totalSeconds.toFixed(1);
    }

    function updateTimerDisplay() {
      const elapsedMs = Date.now() - timerStartTimestamp;
      const elapsedSec = elapsedMs / 1000;
      document.getElementById("timer-display").textContent = formatSeconds(elapsedSec);
    }

    function toggleTimer() {
      if (!timerRunning) {
        startTimer();
      } else {
        stopTimer();
      }
    }

    function startTimer() {
      if (!getSelectedExerciseId()) return; // no exercises exist
      timerRunning = true;
      timerStartTimestamp = Date.now();
      timerIntervalId = setInterval(updateTimerDisplay, 100);

      const btn = document.getElementById("timer-toggle-btn");
      btn.textContent = "Stop";
      btn.classList.remove("start");
      btn.classList.add("stop");

      document.getElementById("exercise-select").disabled = true;
    }

    function stopTimer() {
      clearInterval(timerIntervalId);
      timerRunning = false;

      const elapsedMs = Date.now() - timerStartTimestamp;
      pendingDuration = Math.round((elapsedMs / 1000) * 10) / 10; // round to 1 decimal

      const btn = document.getElementById("timer-toggle-btn");
      btn.textContent = "Start";
      btn.classList.remove("stop");
      btn.classList.add("start");
      document.getElementById("timer-display").textContent = "0.0";

      showReviewScreen();
    }

    function showReviewScreen() {
      document.getElementById("timer-active-view").classList.add("hidden");
      document.getElementById("timer-review-view").classList.remove("hidden");
      document.getElementById("review-duration").textContent = formatSeconds(pendingDuration) + "s";
      document.getElementById("review-edit-row").classList.add("hidden");
      document.getElementById("review-edit-btn").textContent = "Edit";
    }

    function hideReviewScreen() {
      document.getElementById("timer-review-view").classList.add("hidden");
      document.getElementById("timer-active-view").classList.remove("hidden");
      document.getElementById("exercise-select").disabled = false;
      pendingDuration = null;
    }

    function toggleEditReview() {
      const editRow = document.getElementById("review-edit-row");
      const editBtn = document.getElementById("review-edit-btn");
      const isEditing = !editRow.classList.contains("hidden");

      if (!isEditing) {
        // Enter edit mode
        const input = document.getElementById("review-edit-input");
        input.value = pendingDuration;
        editRow.classList.remove("hidden");
        editBtn.textContent = "Done";
        input.focus();
      } else {
        // Confirm edited value
        const input = document.getElementById("review-edit-input");
        const newVal = parseFloat(input.value);
        if (isNaN(newVal) || newVal < 0) {
          alert("Please enter a valid duration.");
          return;
        }
        pendingDuration = Math.round(newVal * 10) / 10;
        document.getElementById("review-duration").textContent = formatSeconds(pendingDuration) + "s";
        editRow.classList.add("hidden");
        editBtn.textContent = "Edit";
      }
    }

    function discardSession() {
      hideReviewScreen();
    }

    function saveSession() {
      const exerciseId = getSelectedExerciseId();
      if (!exerciseId || pendingDuration === null) return;

      const data = loadData();
      const now = new Date();
      const session = {
        id: generateId("s"),
        exerciseId: exerciseId,
        date: getTodayString(),
        timestamp: now.getTime(),
        duration: pendingDuration
      };
      data.sessions.push(session);
      saveData(data);

      hideReviewScreen();
    }

    // If the app was backgrounded while the timer was running, update display
    // on return so the elapsed time reflects real wall-clock time, not a
    // possibly-paused interval.
    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState === "visible" && timerRunning) {
        updateTimerDisplay();
      }
    });
  </script>

  <!-- ============================================
       INIT
       ============================================ -->
  <script>
    renderExerciseList();
  </script>

</body>
</html>

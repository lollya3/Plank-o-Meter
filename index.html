  <!-- ============================================
       STYLES
       ============================================ -->
  <style>
    /* ---- Base ---- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 60px;
    }

    /* ---- Theme: Cool blue-green ---- */
    body {
      --bg: #16191F;
      --card-bg: #22262E;
      --text: #F0F4F8;
      --text-muted: #9AA5B1;
      --primary: #4FE0CB;
      --primary-text: #16191F;
      --accent: #7DD3F0;
      --secondary: #2C313A;
      --border: #3A4049;
      --danger: #FF6B6B;
    }

    /* ---- Header ---- */
    .app-header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 8px;
    }

    .app-header h1 {
      font-size: 30px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    /* ---- Cards ---- */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    /* ---- Collapsible section ---- */
    .collapsible-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .collapsible-header h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .collapsible-arrow {
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .collapsible-arrow.open {
      transform: rotate(180deg);
    }

    .collapsible-body {
      display: none;
      margin-top: 14px;
    }

    .collapsible-body.open {
      display: block;
    }

    /* ---- Exercise list ---- */
    .exercise-list {
      list-style: none;
      margin-bottom: 14px;
    }

    .exercise-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .exercise-item:last-child {
      border-bottom: none;
    }

    .exercise-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .exercise-name {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
    }

    .exercise-name-input {
      flex: 1;
      background: var(--secondary);
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 15px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 6px;
    }

    .icon-btn.danger {
      color: var(--danger);
    }

    .icon-btn.confirm {
      color: var(--primary);
    }

    /* ---- Add exercise row ---- */
    .add-exercise-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .add-exercise-row input {
      flex: 1;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 15px;
    }

    .add-exercise-row input::placeholder {
      color: var(--text-muted);
    }

    .add-exercise-row input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .add-btn {
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }

    /* ---- Placeholder for future steps ---- */
    .placeholder-card {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 15px;
    }

    .placeholder-card .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    /* ---- Timer card ---- */
    .exercise-select {
      width: 100%;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 18px;
      -webkit-appearance: none;
      appearance: none;
    }

    .timer-display {
      text-align: center;
      font-size: 56px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--primary);
      margin-bottom: 8px;
      letter-spacing: -1px;
      transition: color 0.2s ease;
    }

    .timer-hint {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 18px;
    }

    .timer-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
    }

    .timer-btn.start {
      background: var(--primary);
      color: var(--primary-text);
    }

    .timer-btn.stop {
      background: var(--danger);
      color: #1A1A1D;
    }

    /* ---- Review screen (after stopping timer) ---- */
    .review-duration {
      text-align: center;
      font-size: 48px;
      font-weight: 800;
      color: var(--accent);
      margin: 12px 0 4px;
    }

    .review-edit-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .review-edit-row input {
      width: 90px;
      text-align: center;
      background: var(--secondary);
      border: 1px solid var(--primary);
      border-radius: 10px;
      padding: 10px;
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
    }

    .review-edit-row span {
      color: var(--text-muted);
      font-size: 15px;
    }

    .review-btn-row {
      display: flex;
      gap: 10px;
    }

    .review-btn-row button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .review-btn-row .save-btn {
      background: var(--primary);
      color: var(--primary-text);
    }

    .review-btn-row .edit-btn {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .review-btn-row .discard-btn {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .hidden {
      display: none !important;
    }

    /* ---- Stats card ---- */
    .stats-card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .stat-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-box {
      flex: 1;
      background: var(--secondary);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
    }

    .stat-box-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .stat-box-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
    }

    .stat-box-value.highlight {
      color: var(--primary);
    }

    .streak-row {
      display: flex;
      gap: 10px;
    }

    .streak-box {
      flex: 1;
      background: var(--secondary);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
    }

    .streak-box-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .streak-box-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
    }

    .streak-box-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ---- History card ---- */
    .history-filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .history-filter-row select {
      flex: 1;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      -webkit-appearance: none;
      appearance: none;
    }

    .history-list {
      list-style: none;
    }

    .history-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-item-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .history-item-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .history-item-info {
      flex: 1;
    }

    .history-item-name {
      font-size: 15px;
      font-weight: 600;
    }

    .history-item-date {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .history-item-duration {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent);
    }

    .history-item-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      margin-left: 20px;
    }

    .history-edit-row {
      margin-top: 10px;
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-edit-row input {
      background: var(--secondary);
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 15px;
      width: 100%;
    }

    .history-edit-btn-row {
      display: flex;
      gap: 8px;
    }

    .history-edit-btn-row button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .history-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 24px 0;
    }

    .export-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .export-row button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .export-btn {
      background: var(--secondary);
      color: var(--text);
    }

    .import-btn {
      background: var(--secondary);
      color: var(--text);
    }

    .danger-btn {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger) !important;
    }

    /* ---- Custom confirm modal ---- */
    .confirm-modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 8888;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .confirm-modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      margin: 20px;
      max-width: 340px;
      width: 100%;
    }

    .confirm-modal p {
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 20px;
      text-align: center;
    }

    .confirm-modal-btns {
      display: flex;
      gap: 10px;
    }

    .confirm-modal-btns button {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .confirm-cancel-btn {
      background: var(--secondary);
      color: var(--text);
    }

    .confirm-ok-btn {
      background: var(--danger);
      color: #fff;
    }

    /* ---- Celebration overlay ---- */
    .celebration-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 12, 18, 0.92);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .celebration-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .celebration-message {
      text-align: center;
      z-index: 2;
      padding: 0 24px;
    }

    .celebration-emoji {
      display: none;
    }

    .celebration-big-number {
      font-size: 96px;
      font-weight: 900;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 30px #4FE0CB, 0 0 80px #4FE0CB, 0 0 120px #00FFEA;
      letter-spacing: -4px;
      margin-bottom: 6px;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .celebration-title {
      font-size: 28px;
      font-weight: 900;
      color: #4FE0CB;
      margin-bottom: 10px;
      text-shadow: 0 0 16px #4FE0CB, 0 0 40px #4FE0CB;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s both;
    }

    .celebration-subtitle {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
    }

    .celebration-tap-hint {
      position: absolute;
      bottom: 48px;
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .celebration-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>Plank-o-Meter</h1>
  </header>

  <main>

    <!-- ============================================
         MANAGE EXERCISES (collapsible)
         ============================================ -->
    <div class="card" id="manage-exercises-card">
      <div class="collapsible-header" onclick="toggleManageExercises()">
        <h2>Manage Exercises</h2>
        <span class="collapsible-arrow" id="manage-arrow">▼</span>
      </div>
      <div class="collapsible-body" id="manage-body">
        <ul class="exercise-list" id="exercise-list"></ul>
        <div class="add-exercise-row">
          <input type="text" id="new-exercise-input" placeholder="New exercise name..." maxlength="40">
          <button class="add-btn" onclick="addExercise()">+</button>
        </div>
      </div>
    </div>

    <!-- ============================================
         TIMER
         ============================================ -->
    <div class="card" id="timer-card">

      <!-- Exercise picker -->
      <select class="exercise-select" id="exercise-select" onchange="onExerciseChange()"></select>

      <!-- Idle / running state -->
      <div id="timer-active-view">
        <div class="timer-display" id="timer-display">0.0</div>
        <div class="timer-hint">seconds &mdash; keep this screen open while timing</div>
        <button class="timer-btn start" id="timer-toggle-btn" onclick="toggleTimer()">Start</button>
      </div>

      <!-- Review state (shown after Stop) -->
      <div id="timer-review-view" class="hidden">
        <div class="review-duration" id="review-duration">0.0s</div>
        <div class="review-edit-row hidden" id="review-edit-row">
          <input type="number" id="review-edit-input" step="0.1" min="0">
          <span>seconds</span>
        </div>
        <div class="review-btn-row">
          <button class="discard-btn" onclick="discardSession()">Discard</button>
          <button class="edit-btn" id="review-edit-btn" onclick="toggleEditReview()">Edit</button>
          <button class="save-btn" onclick="saveSession()">Save</button>
        </div>
      </div>
    </div>

    <!-- ============================================
         STATS
         ============================================ -->
    <div class="card" id="stats-card">
      <div class="stats-card-title" id="stats-exercise-name">Plank</div>

      <div class="stat-row">
        <div class="stat-box">
          <div class="stat-box-label">Today's Best</div>
          <div class="stat-box-value" id="stat-today">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-label">Personal Best</div>
          <div class="stat-box-value highlight" id="stat-pb">—</div>
        </div>
      </div>

      <div class="streak-row">
        <div class="streak-box">
          <div class="streak-box-label">🔥 This Exercise</div>
          <div class="streak-box-value" id="stat-streak-exercise">0</div>
          <div class="streak-box-sub" id="stat-streak-exercise-longest">Longest: 0</div>
        </div>
        <div class="streak-box">
          <div class="streak-box-label">⚡ Overall</div>
          <div class="streak-box-value" id="stat-streak-overall">0</div>
          <div class="streak-box-sub" id="stat-streak-overall-longest">Longest: 0</div>
        </div>
      </div>
    </div>

    <!-- ============================================
         HISTORY (collapsible)
         ============================================ -->
    <div class="card">
      <div class="collapsible-header" onclick="toggleHistory()">
        <h2>History</h2>
        <span class="collapsible-arrow" id="history-arrow">▼</span>
      </div>
      <div class="collapsible-body" id="history-body">

        <div class="history-filter-row">
          <select id="history-filter" onchange="renderHistory()">
            <option value="all">All exercises</option>
          </select>
        </div>

        <ul class="history-list" id="history-list"></ul>

        <div class="export-row">
          <button class="export-btn" onclick="exportData()">⬇️ Export</button>
          <button class="import-btn" onclick="triggerImport()">⬆️ Import</button>
          <button class="danger-btn" onclick="clearAllData()">🗑️ Reset</button>
        </div>

        <input type="file" id="import-file-input" accept=".json" style="display:none">
      </div>
    </div>

  </main>

  <!-- ============================================
       DATA MODEL & LOCALSTORAGE LAYER
       ============================================
       All reading/writing to localStorage happens
       through these functions.

       Data shapes:

       exercises: [
         { id: "ex_...", name: "Plank", color: "#hex" }
       ]

       sessions: [
         { id: "s_...", exerciseId: "ex_...", date: "YYYY-MM-DD",
           timestamp: <ms>, duration: <seconds> }
       ]

       personalBests: {
         "<exerciseId>": { duration: <seconds>, date: "YYYY-MM-DD" }
       }

       streaks: {
         overall: { current: 0, longest: 0, lastDate: "YYYY-MM-DD" | null },
         "<exerciseId>": { current: 0, longest: 0, lastDate: "YYYY-MM-DD" | null }
       }

       milestonesReached: {
         "<exerciseId>": [30, 60, 120, ...]   // duration milestones already celebrated
       }
       ============================================ -->
  <script>
    const STORAGE_KEY = "plankometer_data";

    const DEFAULT_EXERCISES = [
      { id: "ex_plank", name: "Plank", color: "#4FE0CB" },
      { id: "ex_wallsit", name: "Wall Sit", color: "#7DD3F0" },
      { id: "ex_hang", name: "Hang", color: "#A78BFA" }
    ];

    const DEFAULT_DATA = {
      exercises: DEFAULT_EXERCISES,
      sessions: [],
      personalBests: {},
      streaks: {
        overall: { current: 0, longest: 0, lastDate: null }
      },
      milestonesReached: {}
    };

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          saveData(DEFAULT_DATA);
          return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
        const parsed = JSON.parse(raw);
        return {
          exercises: parsed.exercises || DEFAULT_EXERCISES,
          sessions: parsed.sessions || [],
          personalBests: parsed.personalBests || {},
          streaks: parsed.streaks || { overall: { current: 0, longest: 0, lastDate: null } },
          milestonesReached: parsed.milestonesReached || {}
        };
      } catch (err) {
        console.error("Failed to load data, using defaults:", err);
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch (err) {
        console.error("Failed to save data:", err);
        alert("Could not save data. Storage may be full.");
        return false;
      }
    }

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function generateId(prefix) {
      return `${prefix}_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
    }

    // Custom confirm replacing browser confirm() which Chrome may block
    let confirmResolve = null;
    function customConfirm(message, okLabel) {
      return new Promise(function(resolve) {
        confirmResolve = resolve;
        document.getElementById("confirm-modal-message").textContent = message;
        if (okLabel) {
          document.querySelector(".confirm-ok-btn").textContent = okLabel;
        } else {
          document.querySelector(".confirm-ok-btn").textContent = "Confirm";
        }
        document.getElementById("confirm-modal-backdrop").style.display = "flex";
      });
    }

    function resolveConfirm(result) {
      document.getElementById("confirm-modal-backdrop").style.display = "none";
      if (confirmResolve) {
        confirmResolve(result);
        confirmResolve = null;
      }
    }

    // ---- Export / Import ----

    function exportData() {
      const data = loadData();
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `plankometer-backup-${getTodayString()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function importData(jsonString) {
      try {
        const parsed = JSON.parse(jsonString);
        if (!parsed.exercises || !Array.isArray(parsed.exercises)) {
          throw new Error("Invalid file: missing exercises list");
        }
        if (!parsed.sessions || !Array.isArray(parsed.sessions)) {
          throw new Error("Invalid file: missing sessions list");
        }
        const confirmed = await customConfirm(
          "This will replace ALL current data with the imported file. This cannot be undone. Continue?",
          "Replace"
        );
        if (!confirmed) return false;
        saveData({
          exercises: parsed.exercises,
          sessions: parsed.sessions,
          personalBests: parsed.personalBests || {},
          streaks: parsed.streaks || { overall: { current: 0, longest: 0, lastDate: null } },
          milestonesReached: parsed.milestonesReached || {}
        });
        return true;
      } catch (err) {
        console.error("Import failed:", err);
        return false;
      }
    }
  </script>

  <!-- ============================================
       EXERCISE MANAGEMENT
       ============================================ -->
  <script>
    // Color palette — cycles through these for new exercises
    const EXERCISE_COLORS = [
      "#4FE0CB", "#7DD3F0", "#A78BFA", "#F472B6",
      "#FB923C", "#FACC15", "#34D399", "#60A5FA"
    ];

    function toggleManageExercises() {
      const body = document.getElementById("manage-body");
      const arrow = document.getElementById("manage-arrow");
      const isOpen = body.classList.contains("open");
      body.classList.toggle("open", !isOpen);
      arrow.classList.toggle("open", !isOpen);
    }

    function renderExerciseList() {
      const data = loadData();
      const list = document.getElementById("exercise-list");
      list.innerHTML = "";

      data.exercises.forEach(function(ex, index) {
        const li = document.createElement("li");
        li.className = "exercise-item";
        li.id = "exercise-item-" + index;
        li.innerHTML =
          '<div class="exercise-color-dot" style="background:' + ex.color + '"></div>' +
          '<span class="exercise-name">' + ex.name + '</span>' +
          '<button class="icon-btn" onclick="startRenameExercise(' + index + ')">✏️</button>' +
          '<button class="icon-btn danger" onclick="deleteExercise(' + index + ')">🗑️</button>';
        list.appendChild(li);
      });

      renderExerciseDropdown();
    }

    function startRenameExercise(index) {
      const data = loadData();
      const ex = data.exercises[index];
      const item = document.getElementById("exercise-item-" + index);
      item.innerHTML =
        '<div class="exercise-color-dot" style="background:' + ex.color + '"></div>' +
        '<input class="exercise-name-input" id="rename-input-' + index + '" value="' + ex.name + '" maxlength="40">' +
        '<button class="icon-btn confirm" onclick="confirmRenameExercise(' + index + ')">✓</button>' +
        '<button class="icon-btn" onclick="renderExerciseList()">✕</button>';
      const input = document.getElementById("rename-input-" + index);
      input.focus();
      input.select();
    }

    function confirmRenameExercise(index) {
      const input = document.getElementById("rename-input-" + index);
      const newName = input.value.trim();
      if (!newName) {
        alert("Exercise name cannot be empty.");
        return;
      }
      const data = loadData();
      data.exercises[index].name = newName;
      saveData(data);
      renderExerciseList();
    }

    async function deleteExercise(index) {
      const data = loadData();
      const ex = data.exercises[index];

      const hasSessions = data.sessions.some(function(s) { return s.exerciseId === ex.id; });
      const msg = hasSessions
        ? 'Delete "' + ex.name + '"? This exercise has logged sessions — they will also be deleted. This cannot be undone.'
        : 'Delete "' + ex.name + '"?';

      const confirmed = await customConfirm(msg, "Delete");
      if (!confirmed) return;

      data.exercises.splice(index, 1);
      data.sessions = data.sessions.filter(function(s) { return s.exerciseId !== ex.id; });
      delete data.personalBests[ex.id];
      delete data.streaks[ex.id];
      delete data.milestonesReached[ex.id];

      saveData(data);
      renderExerciseList();
    }

    function addExercise() {
      const input = document.getElementById("new-exercise-input");
      const name = input.value.trim();
      if (!name) {
        input.focus();
        return;
      }

      const data = loadData();

      // Check for duplicate name (case-insensitive)
      const duplicate = data.exercises.some(function(ex) {
        return ex.name.toLowerCase() === name.toLowerCase();
      });
      if (duplicate) {
        alert('An exercise called "' + name + '" already exists.');
        return;
      }

      // Pick next color from palette
      const color = EXERCISE_COLORS[data.exercises.length % EXERCISE_COLORS.length];
      const newEx = { id: generateId("ex"), name: name, color: color };
      data.exercises.push(newEx);
      saveData(data);

      input.value = "";
      renderExerciseList();
    }

    // Allow pressing Enter to add exercise
    document.getElementById("new-exercise-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter") addExercise();
    });
  </script>

  <!-- ============================================
       TIMER
       ============================================ -->
  <script>
    const LAST_EXERCISE_KEY = "plankometer_last_exercise";

    let timerRunning = false;
    let timerStartTimestamp = null;   // ms since epoch when Start was tapped
    let timerIntervalId = null;
    let pendingDuration = null;       // seconds, set when Stop is tapped, used by review screen

    function getLastUsedExerciseId() {
      return localStorage.getItem(LAST_EXERCISE_KEY);
    }

    function setLastUsedExerciseId(id) {
      localStorage.setItem(LAST_EXERCISE_KEY, id);
    }

    function renderExerciseDropdown() {
      const data = loadData();
      const select = document.getElementById("exercise-select");
      const lastUsedId = getLastUsedExerciseId();

      select.innerHTML = "";

      if (data.exercises.length === 0) {
        const opt = document.createElement("option");
        opt.textContent = "Add an exercise above to begin";
        opt.disabled = true;
        select.appendChild(opt);
        select.disabled = true;
        return;
      }

      select.disabled = false;
      data.exercises.forEach(function(ex) {
        const opt = document.createElement("option");
        opt.value = ex.id;
        opt.textContent = ex.name;
        select.appendChild(opt);
      });

      // Default to last-used exercise if it still exists, else first in list
      const stillExists = data.exercises.some(function(ex) { return ex.id === lastUsedId; });
      select.value = stillExists ? lastUsedId : data.exercises[0].id;
    }

    function getSelectedExerciseId() {
      return document.getElementById("exercise-select").value;
    }

    function onExerciseChange() {
      setLastUsedExerciseId(getSelectedExerciseId());
      renderStats();
    }

    function formatSeconds(totalSeconds) {
      return totalSeconds.toFixed(1);
    }

    // Colors for each milestone stage — starts at teal, shifts through the sequence
    // Each color corresponds to the color AFTER passing that milestone
    // Snap color stages — only 3 change points, no gradual fade
    // stage 0: 0-1min (teal), stage 1: 1-2min (purple), stage 2: 2-3min (gold+sparkle), stage 3: 3min+ (pink+sparkle)
    const TIMER_SNAP_MILESTONES = [60, 120, 180, 240, 300, 360];
    const TIMER_SNAP_THEMES = [
      { primary: "rgb(79,224,203)",  accent: "rgb(125,211,240)", sparkle: null,    density: 0   },  // 0-1min:  teal
      { primary: "rgb(150,50,255)",  accent: "rgb(190,120,255)", sparkle: "purple", density: 15 },  // 1-2min:  purple, light sparkles
      { primary: "rgb(204,0,255)",   accent: "rgb(230,120,255)", sparkle: "violet", density: 40 },  // 2-3min:  highlighter violet, medium sparkles
      { primary: "rgb(255,45,120)",  accent: "rgb(255,120,180)", sparkle: "pink",   density: 55 },  // 3-4min:  hot pink, medium-dense
      { primary: "rgb(0,180,255)",   accent: "rgb(100,220,255)", sparkle: "blue",   density: 70 },  // 4-5min:  electric blue, dense
      { primary: "rgb(220,220,255)", accent: "rgb(255,255,255)", sparkle: "white",  density: 85 },  // 5-6min:  silver/white, very dense
      { primary: "rgb(0,255,220)",   accent: "rgb(100,255,240)", sparkle: "cyan",   density: 100},  // 6min+:   peak cyan, maximum
    ];

    let sparkleAnimId = null;
    let sparkleParticles = [];
    let sparkleCanvas = null;
    let sparkleCtx = null;
    let currentSparkleColor = null;

    function getSnapStage(elapsedSec) {
      let stage = 0;
      for (let i = 0; i < TIMER_SNAP_MILESTONES.length; i++) {
        if (elapsedSec >= TIMER_SNAP_MILESTONES[i]) stage = i + 1;
      }
      return stage;
    }

    function applyTheme(theme) {
      document.body.style.setProperty("--primary", theme.primary);
      document.body.style.setProperty("--accent", theme.accent);
      document.body.style.setProperty("--primary-text", "#16191F");
    }

    function resetTheme() {
      document.body.style.removeProperty("--primary");
      document.body.style.removeProperty("--accent");
      document.body.style.removeProperty("--primary-text");
      stopSparkle();
    }

    // ---- Background sparkle effect ----
    function startSparkle(color, density) {
      if (currentSparkleColor === color) return;
      stopSparkle();
      currentSparkleColor = color;

      sparkleCanvas = document.getElementById("sparkle-canvas");
      if (!sparkleCanvas) {
        sparkleCanvas = document.createElement("canvas");
        sparkleCanvas.id = "sparkle-canvas";
        sparkleCanvas.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;";
        document.body.appendChild(sparkleCanvas);
      }
      sparkleCanvas.width = window.innerWidth;
      sparkleCanvas.height = window.innerHeight;
      sparkleCtx = sparkleCanvas.getContext("2d");
      sparkleParticles = [];

      const colorMap = {
        purple: ["#BF00FF", "#D966FF", "#9B30D9", "#CC80FF", "#E0B0FF"],
        violet: ["#E600FF", "#F066FF", "#FF80FF", "#D633FF", "#FFB3FF"],
        pink:   ["#FF2D78", "#FF6FAE", "#FF90C0", "#FF45A0", "#FFAAD0"],
        blue:   ["#00B4FF", "#40CFFF", "#80E0FF", "#00D0FF", "#60E8FF"],
        white:  ["#FFFFFF", "#E0E8FF", "#C8D8FF", "#F0F4FF", "#DDEEFF"],
        cyan:   ["#00FFD4", "#40FFE8", "#00E8C0", "#80FFF0", "#00FFC8"],
      };

      const colors = colorMap[color] || colorMap.cyan;

      // Weighted color picker (currently unused now that gold is removed, kept for future use)
      const colorWeights = {};
      const weights = colorWeights[color] || null;

      function pickColor() {
        if (!weights) return colors[Math.floor(Math.random() * colors.length)];
        const total = weights.reduce(function(a,b){return a+b;}, 0);
        let r = Math.random() * total;
        for (let i = 0; i < weights.length; i++) {
          if (r < weights[i]) return colors[i];
          r -= weights[i];
        }
        return colors[0];
      }

      // Center zone to avoid (where timer number lives)
      const cx = sparkleCanvas.width / 2;
      const cy = sparkleCanvas.height * 0.35; // timer is roughly in upper-middle
      const avoidRadius = Math.min(sparkleCanvas.width, sparkleCanvas.height) * 0.22;

      function spawnSparkle() {
        // Pick a position that's not in the avoid zone
        let x, y, attempts = 0;
        do {
          x = Math.random() * sparkleCanvas.width;
          y = Math.random() * sparkleCanvas.height;
          attempts++;
        } while (attempts < 10 && Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy)) < avoidRadius);

        const particleColor = pickColor();
        const isHighlight = weights && particleColor === colors[colors.length - 1];

        sparkleParticles.push({
          x: x, y: y,
          size: isHighlight ? Math.random() * 2 + 2 : Math.random() * 3 + 1,
          opacity: 0,
          maxOpacity: isHighlight ? 1 : Math.random() * 0.6 + 0.2,
          phase: "in",
          holdFrames: isHighlight ? Math.floor(Math.random() * 6 + 3) : Math.floor(Math.random() * 20 + 10),
          holdCount: 0,
          fadeSpeed: isHighlight ? 0.12 : 0.04 + Math.random() * 0.03,
          color: particleColor,
          twinkle: !isHighlight && Math.random() > 0.4
        });
      }

      // Seed based on density
      const seedCount = Math.floor(density * 0.4);
      for (let i = 0; i < seedCount; i++) spawnSparkle();

      // Spawn rate based on density (0-100 → 0.1-0.6 per frame)
      const spawnRate = 0.1 + (density / 100) * 0.5;

      function drawSparkle() {
        sparkleCtx.clearRect(0, 0, sparkleCanvas.width, sparkleCanvas.height);

        if (Math.random() < spawnRate) spawnSparkle();

        sparkleParticles = sparkleParticles.filter(function(p) {
          if (p.phase === "in") {
            p.opacity += p.fadeSpeed;
            if (p.opacity >= p.maxOpacity) { p.opacity = p.maxOpacity; p.phase = "hold"; }
          } else if (p.phase === "hold") {
            p.holdCount++;
            if (p.twinkle) p.opacity = p.maxOpacity * (0.6 + 0.4 * Math.sin(p.holdCount * 0.3));
            if (p.holdCount >= p.holdFrames) p.phase = "out";
          } else {
            p.opacity -= p.fadeSpeed;
            if (p.opacity <= 0) return false;
          }

          sparkleCtx.save();
          sparkleCtx.globalAlpha = Math.max(0, p.opacity);
          sparkleCtx.fillStyle = p.color;
          sparkleCtx.translate(p.x, p.y);
          const s = p.size;
          sparkleCtx.beginPath();
          sparkleCtx.moveTo(0, -s * 3);
          sparkleCtx.lineTo(s * 0.4, -s * 0.4);
          sparkleCtx.lineTo(s * 3, 0);
          sparkleCtx.lineTo(s * 0.4, s * 0.4);
          sparkleCtx.lineTo(0, s * 3);
          sparkleCtx.lineTo(-s * 0.4, s * 0.4);
          sparkleCtx.lineTo(-s * 3, 0);
          sparkleCtx.lineTo(-s * 0.4, -s * 0.4);
          sparkleCtx.closePath();
          sparkleCtx.fill();
          sparkleCtx.restore();

          return true;
        });

        sparkleAnimId = requestAnimationFrame(drawSparkle);
      }

      sparkleAnimId = requestAnimationFrame(drawSparkle);
    }

    function stopSparkle() {
      if (sparkleAnimId) cancelAnimationFrame(sparkleAnimId);
      sparkleAnimId = null;
      currentSparkleColor = null;
      const canvas = document.getElementById("sparkle-canvas");
      if (canvas) canvas.remove();
      sparkleParticles = [];
    }

    let lastStage = -1;

    function updateTimerDisplay() {
      const elapsedMs = Date.now() - timerStartTimestamp;
      const elapsedSec = elapsedMs / 1000;
      const display = document.getElementById("timer-display");
      display.textContent = formatSeconds(elapsedSec);

      const stage = getSnapStage(elapsedSec);
      if (stage !== lastStage) {
        lastStage = stage;
        const theme = TIMER_SNAP_THEMES[stage];
        applyTheme(theme);
        if (theme.sparkle) {
          startSparkle(theme.sparkle, theme.density);
        } else {
          stopSparkle();
        }
      }
    }

    function toggleTimer() {
      if (!timerRunning) {
        startTimer();
      } else {
        stopTimer();
      }
    }

    function startTimer() {
      if (!getSelectedExerciseId()) return; // no exercises exist
      timerRunning = true;
      timerStartTimestamp = Date.now();
      lastStage = -1;
      timerIntervalId = setInterval(updateTimerDisplay, 100);

      const btn = document.getElementById("timer-toggle-btn");
      btn.textContent = "Stop";
      btn.classList.remove("start");
      btn.classList.add("stop");

      document.getElementById("exercise-select").disabled = true;
    }

    function stopTimer() {
      clearInterval(timerIntervalId);
      timerRunning = false;

      const elapsedMs = Date.now() - timerStartTimestamp;
      pendingDuration = Math.round((elapsedMs / 1000) * 10) / 10; // round to 1 decimal

      const btn = document.getElementById("timer-toggle-btn");
      btn.textContent = "Start";
      btn.classList.remove("stop");
      btn.classList.add("start");
      document.getElementById("timer-display").textContent = "0.0";
      document.getElementById("timer-display").style.color = "";
      resetTheme();

      showReviewScreen();
    }

    function showReviewScreen() {
      document.getElementById("timer-active-view").classList.add("hidden");
      document.getElementById("timer-review-view").classList.remove("hidden");
      document.getElementById("review-duration").textContent = formatSeconds(pendingDuration) + "s";
      document.getElementById("review-edit-row").classList.add("hidden");
      document.getElementById("review-edit-btn").textContent = "Edit";
    }

    function hideReviewScreen() {
      document.getElementById("timer-review-view").classList.add("hidden");
      document.getElementById("timer-active-view").classList.remove("hidden");
      document.getElementById("exercise-select").disabled = false;
      pendingDuration = null;
    }

    function toggleEditReview() {
      const editRow = document.getElementById("review-edit-row");
      const editBtn = document.getElementById("review-edit-btn");
      const isEditing = !editRow.classList.contains("hidden");

      if (!isEditing) {
        // Enter edit mode
        const input = document.getElementById("review-edit-input");
        input.value = pendingDuration;
        editRow.classList.remove("hidden");
        editBtn.textContent = "Done";
        input.focus();
      } else {
        // Confirm edited value
        const input = document.getElementById("review-edit-input");
        const newVal = parseFloat(input.value);
        if (isNaN(newVal) || newVal < 0) {
          alert("Please enter a valid duration.");
          return;
        }
        pendingDuration = Math.round(newVal * 10) / 10;
        document.getElementById("review-duration").textContent = formatSeconds(pendingDuration) + "s";
        editRow.classList.add("hidden");
        editBtn.textContent = "Edit";
      }
    }

    function discardSession() {
      hideReviewScreen();
    }

    function saveSession() {
      const exerciseId = getSelectedExerciseId();
      if (!exerciseId || pendingDuration === null) return;

      const data = loadData();

      const now = new Date();
      const session = {
        id: generateId("s"),
        exerciseId: exerciseId,
        date: getTodayString(),
        timestamp: now.getTime(),
        duration: pendingDuration
      };
      data.sessions.push(session);
      saveData(data);

      const savedDuration = pendingDuration;
      data.sessions.push(session);
      saveData(data);

      const dataAfterSave = recalculateStreaks();
      renderStats();
      hideReviewScreen();

      // Check duration milestones
      const DURATION_MILESTONES = [15, 30, 45, 60, 90, 120, 180, 300];
      const reached = (dataAfterSave.milestonesReached[exerciseId] || []).slice();

      // Find the highest milestone this session reached
      let highestReached = null;
      for (let i = DURATION_MILESTONES.length - 1; i >= 0; i--) {
        if (savedDuration >= DURATION_MILESTONES[i]) {
          highestReached = DURATION_MILESTONES[i];
          break;
        }
      }

      // Only celebrate if that specific highest milestone hasn't been celebrated yet
      let newMilestone = null;
      if (highestReached !== null && reached.indexOf(highestReached) === -1) {
        newMilestone = highestReached;
      }

      const ex = dataAfterSave.exercises.find(function(e) { return e.id === exerciseId; });
      const exName = ex ? ex.name : "exercise";

      if (newMilestone !== null) {
        const data2 = loadData();
        if (!data2.milestonesReached[exerciseId]) data2.milestonesReached[exerciseId] = [];
        data2.milestonesReached[exerciseId].push(newMilestone);
        saveData(data2);

        const label = newMilestone >= 60
          ? (newMilestone / 60) + " min"
          : newMilestone + " sec";
        showCelebration(label, "New Milestone!", exName);
      } else {
        const exStreak = dataAfterSave.streaks[exerciseId];
        if (exStreak && STREAK_MILESTONES.indexOf(exStreak.current) !== -1) {
          showCelebration(exStreak.current + " days", "Streak!", exName);
        } else {
          const overall = dataAfterSave.streaks.overall;
          if (overall && STREAK_MILESTONES.indexOf(overall.current) !== -1) {
            showCelebration(overall.current + " days", "Streak!", "Keep it up!");
          }
        }
      }
    }

    // If the app was backgrounded while the timer was running, update display
    // on return so the elapsed time reflects real wall-clock time, not a
    // possibly-paused interval.
    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState === "visible" && timerRunning) {
        updateTimerDisplay();
      }
    });
  </script>

  <!-- ============================================
       STATS & STREAKS
       ============================================ -->
  <script>
    // Format seconds into a readable string e.g. "1m 23.4s" or "45.2s"
    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined) return "—";
      if (seconds >= 60) {
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(1);
        return mins + "m " + secs + "s";
      }
      return seconds.toFixed(1) + "s";
    }

    // ---- Streak calculation ----
    // Returns the number of calendar days between two YYYY-MM-DD strings
    function daysBetween(dateStr1, dateStr2) {
      const d1 = new Date(dateStr1 + "T00:00:00");
      const d2 = new Date(dateStr2 + "T00:00:00");
      return Math.round(Math.abs((d2 - d1) / (1000 * 60 * 60 * 24)));
    }

    // Recalculate and save streaks based on current sessions.
    // Called on app load and after every session save.
    function recalculateStreaks() {
      const data = loadData();
      const today = getTodayString();

      // ---- Per-exercise streaks ----
      data.exercises.forEach(function(ex) {
        // Get all unique dates for this exercise, sorted ascending
        const dates = data.sessions
          .filter(function(s) { return s.exerciseId === ex.id; })
          .map(function(s) { return s.date; });

        const uniqueDates = [...new Set(dates)].sort();

        if (uniqueDates.length === 0) {
          data.streaks[ex.id] = { current: 0, longest: 0, lastDate: null };
          return;
        }

        const lastDate = uniqueDates[uniqueDates.length - 1];

        // If last session was before yesterday, streak is broken
        const gapFromToday = daysBetween(lastDate, today);
        if (gapFromToday > 1) {
          const existing = data.streaks[ex.id] || { longest: 0 };
          data.streaks[ex.id] = {
            current: 0,
            longest: existing.longest || 0,
            lastDate: lastDate
          };
          return;
        }

        // Count current streak backwards from most recent date
        let current = 1;
        for (let i = uniqueDates.length - 1; i > 0; i--) {
          if (daysBetween(uniqueDates[i - 1], uniqueDates[i]) === 1) {
            current++;
          } else {
            break;
          }
        }

        const existing = data.streaks[ex.id] || { longest: 0 };
        const longest = Math.max(current, existing.longest || 0);
        data.streaks[ex.id] = { current: current, longest: longest, lastDate: lastDate };
      });

      // ---- Overall streak (any exercise on a given day) ----
      const allDates = data.sessions.map(function(s) { return s.date; });
      const uniqueAllDates = [...new Set(allDates)].sort();

      if (uniqueAllDates.length === 0) {
        data.streaks.overall = { current: 0, longest: 0, lastDate: null };
      } else {
        const lastDate = uniqueAllDates[uniqueAllDates.length - 1];
        const gapFromToday = daysBetween(lastDate, today);

        if (gapFromToday > 1) {
          const existing = data.streaks.overall || { longest: 0 };
          data.streaks.overall = {
            current: 0,
            longest: existing.longest || 0,
            lastDate: lastDate
          };
        } else {
          let current = 1;
          for (let i = uniqueAllDates.length - 1; i > 0; i--) {
            if (daysBetween(uniqueAllDates[i - 1], uniqueAllDates[i]) === 1) {
              current++;
            } else {
              break;
            }
          }
          const existing = data.streaks.overall || { longest: 0 };
          const longest = Math.max(current, existing.longest || 0);
          data.streaks.overall = { current: current, longest: longest, lastDate: lastDate };
        }
      }

      // ---- Personal bests ----
      data.exercises.forEach(function(ex) {
        const exSessions = data.sessions.filter(function(s) { return s.exerciseId === ex.id; });
        if (exSessions.length === 0) {
          delete data.personalBests[ex.id];
          return;
        }
        const best = exSessions.reduce(function(max, s) {
          return s.duration > max.duration ? s : max;
        }, exSessions[0]);
        data.personalBests[ex.id] = { duration: best.duration, date: best.date };
      });

      saveData(data);
      return data;
    }

    // ---- Render stats for the currently-selected exercise ----
    function renderStats() {
      const data = loadData();
      const exerciseId = getSelectedExerciseId();
      const today = getTodayString();

      // Exercise name in stats title
      const ex = data.exercises.find(function(e) { return e.id === exerciseId; });
      document.getElementById("stats-exercise-name").textContent = ex ? ex.name : "—";

      // Today's best
      const todaySessions = data.sessions.filter(function(s) {
        return s.exerciseId === exerciseId && s.date === today;
      });
      const todayBest = todaySessions.length > 0
        ? Math.max.apply(null, todaySessions.map(function(s) { return s.duration; }))
        : null;
      document.getElementById("stat-today").textContent = formatDuration(todayBest);

      // Personal best
      const pb = data.personalBests[exerciseId];
      document.getElementById("stat-pb").textContent = pb ? formatDuration(pb.duration) : "—";

      // Per-exercise streak
      const exStreak = data.streaks[exerciseId] || { current: 0, longest: 0 };
      document.getElementById("stat-streak-exercise").textContent = exStreak.current + " day" + (exStreak.current === 1 ? "" : "s");
      document.getElementById("stat-streak-exercise-longest").textContent = "Longest: " + (exStreak.longest || 0);

      // Overall streak
      const overall = data.streaks.overall || { current: 0, longest: 0 };
      document.getElementById("stat-streak-overall").textContent = overall.current + " day" + (overall.current === 1 ? "" : "s");
      document.getElementById("stat-streak-overall-longest").textContent = "Longest: " + (overall.longest || 0);
    }
  </script>

  <!-- ============================================
       HISTORY
       ============================================ -->
  <script>
    function toggleHistory() {
      const body = document.getElementById("history-body");
      const arrow = document.getElementById("history-arrow");
      const isOpen = body.classList.contains("open");
      body.classList.toggle("open", !isOpen);
      arrow.classList.toggle("open", !isOpen);
      if (!isOpen) renderHistory();
    }

    function renderHistoryFilter() {
      const data = loadData();
      const select = document.getElementById("history-filter");
      const current = select.value;
      select.innerHTML = '<option value="all">All exercises</option>';
      data.exercises.forEach(function(ex) {
        const opt = document.createElement("option");
        opt.value = ex.id;
        opt.textContent = ex.name;
        select.appendChild(opt);
      });
      // Restore selection if still valid
      if (current && [...select.options].some(function(o) { return o.value === current; })) {
        select.value = current;
      }
    }

    function renderHistory() {
      const data = loadData();
      const filter = document.getElementById("history-filter").value;
      const list = document.getElementById("history-list");
      list.innerHTML = "";

      // Filter and sort sessions newest first
      let sessions = data.sessions.slice();
      if (filter !== "all") {
        sessions = sessions.filter(function(s) { return s.exerciseId === filter; });
      }
      sessions.sort(function(a, b) { return b.timestamp - a.timestamp; });

      if (sessions.length === 0) {
        list.innerHTML = '<li class="history-empty">No sessions yet</li>';
        return;
      }

      sessions.forEach(function(session) {
        const ex = data.exercises.find(function(e) { return e.id === session.exerciseId; });
        const exName = ex ? ex.name : "Unknown";
        const exColor = ex ? ex.color : "#9AA5B1";

        const li = document.createElement("li");
        li.className = "history-item";
        li.id = "history-item-" + session.id;
        li.innerHTML =
          '<div class="history-item-top">' +
            '<div class="history-item-dot" style="background:' + exColor + '"></div>' +
            '<div class="history-item-info">' +
              '<div class="history-item-name">' + exName + '</div>' +
              '<div class="history-item-date">' + formatHistoryDate(session.date) + '</div>' +
            '</div>' +
            '<div class="history-item-duration">' + formatDuration(session.duration) + '</div>' +
          '</div>' +
          '<div class="history-item-actions">' +
            '<button class="icon-btn" onclick="startEditSession(\'' + session.id + '\')">✏️ Edit</button>' +
            '<button class="icon-btn danger" onclick="deleteSession(\'' + session.id + '\')">🗑️ Delete</button>' +
          '</div>';
        list.appendChild(li);
      });
    }

    function formatHistoryDate(dateStr) {
      const d = new Date(dateStr + "T00:00:00");
      return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    }

    function cancelEditSession(sessionId) {
      const data = loadData();
      const session = data.sessions.find(function(s) { return s.id === sessionId; });
      if (!session) { renderHistory(); return; }

      const ex = data.exercises.find(function(e) { return e.id === session.exerciseId; });
      const exName = ex ? ex.name : "Unknown";
      const exColor = ex ? ex.color : "#9AA5B1";

      const item = document.getElementById("history-item-" + sessionId);
      item.innerHTML =
        '<div class="history-item-top">' +
          '<div class="history-item-dot" style="background:' + exColor + '"></div>' +
          '<div class="history-item-info">' +
            '<div class="history-item-name">' + exName + '</div>' +
            '<div class="history-item-date">' + formatHistoryDate(session.date) + '</div>' +
          '</div>' +
          '<div class="history-item-duration">' + formatDuration(session.duration) + '</div>' +
        '</div>' +
        '<div class="history-item-actions">' +
          '<button class="icon-btn" onclick="startEditSession(\'' + sessionId + '\')">✏️ Edit</button>' +
          '<button class="icon-btn danger" onclick="deleteSession(\'' + sessionId + '\')">🗑️ Delete</button>' +
        '</div>';
    }

    function startEditSession(sessionId) {
      const data = loadData();
      const session = data.sessions.find(function(s) { return s.id === sessionId; });
      if (!session) return;

      const item = document.getElementById("history-item-" + sessionId);
      const ex = data.exercises.find(function(e) { return e.id === session.exerciseId; });
      const exName = ex ? ex.name : "Unknown";
      const exColor = ex ? ex.color : "#9AA5B1";

      item.innerHTML =
        '<div class="history-item-top">' +
          '<div class="history-item-dot" style="background:' + exColor + '"></div>' +
          '<div class="history-item-info">' +
            '<div class="history-item-name">' + exName + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="history-edit-row">' +
          '<input type="number" id="edit-duration-' + sessionId + '" value="' + session.duration + '" step="0.1" min="0" placeholder="Duration (seconds)">' +
          '<input type="date" id="edit-date-' + sessionId + '" value="' + session.date + '">' +
          '<div class="history-edit-btn-row">' +
            '<button style="background:var(--secondary);color:var(--text);border:1px solid var(--border)" onclick="cancelEditSession(\'' + sessionId + '\')">Cancel</button>' +
            '<button style="background:var(--primary);color:var(--primary-text)" onclick="confirmEditSession(\'' + sessionId + '\')">Save</button>' +
          '</div>' +
        '</div>';
    }

    function confirmEditSession(sessionId) {
      const durationInput = document.getElementById("edit-duration-" + sessionId);
      const dateInput = document.getElementById("edit-date-" + sessionId);

      const newDuration = parseFloat(durationInput.value);
      const newDate = dateInput.value;

      if (isNaN(newDuration) || newDuration < 0) {
        alert("Please enter a valid duration.");
        return;
      }
      if (!newDate) {
        alert("Please enter a valid date.");
        return;
      }

      const data = loadData();
      const idx = data.sessions.findIndex(function(s) { return s.id === sessionId; });
      if (idx === -1) return;

      data.sessions[idx].duration = Math.round(newDuration * 10) / 10;
      data.sessions[idx].date = newDate;
      saveData(data);

      recalculateStreaks();
      renderStats();
      renderHistory();
    }

    async function deleteSession(sessionId) {
      const confirmed = await customConfirm("Delete this session? This cannot be undone.", "Delete");
      if (!confirmed) return;

      const data = loadData();
      data.sessions = data.sessions.filter(function(s) { return s.id !== sessionId; });
      saveData(data);

      recalculateStreaks();
      renderStats();
      renderHistory();
    }

    async function clearAllData() {
      const confirmed = await customConfirm("Reset ALL data? This will delete every session, personal best, and streak. This cannot be undone.", "Reset");
      if (!confirmed) return;
      const data = loadData();
      data.sessions = [];
      data.personalBests = {};
      data.streaks = { overall: { current: 0, longest: 0, lastDate: null } };
      data.milestonesReached = {};
      saveData(data);
      recalculateStreaks();
      renderStats();
      renderHistory();
    }

    function triggerImport() {
      document.getElementById("import-file-input").click();
    }

    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("import-file-input").addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
          const success = importData(evt.target.result);
          if (success) {
            recalculateStreaks();
            renderExerciseList();
            renderStats();
            renderHistory();
            alert("Import successful!");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      });
    });
  </script>

  <!-- ============================================
       CELEBRATIONS
       ============================================ -->
  <script>
    const STREAK_MILESTONES = [3, 7, 14, 30, 60, 100, 365];

    let celebrationTimeout = null;
    let confettiAnimId = null;
    let confettiParticles = [];

    function showCelebration(bigNumber, title, subtitle) {
      const overlay = document.getElementById("celebration-overlay");
      document.getElementById("celebration-big-number").textContent = bigNumber;
      document.getElementById("celebration-title").textContent = title;
      document.getElementById("celebration-subtitle").textContent = subtitle;

      overlay.classList.add("active");
      startBurst();

      if (celebrationTimeout) clearTimeout(celebrationTimeout);
      celebrationTimeout = setTimeout(dismissCelebration, 6000);
    }

    function dismissCelebration() {
      const overlay = document.getElementById("celebration-overlay");
      overlay.classList.remove("active");
      stopBurst();
      if (celebrationTimeout) clearTimeout(celebrationTimeout);
    }

    // ---- Neon shockwave burst ----
    function startBurst() {
      const canvas = document.getElementById("celebration-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const neonColors = ["#4FE0CB", "#00FFEA", "#7DD3F0", "#BF5FFF", "#FF2D78", "#FFE600", "#00FF9F", "#FF6FD8"];

      const rings = [];
      // 3 waves of rings, staggered
      for (let wave = 0; wave < 3; wave++) {
        for (let i = 0; i < 4; i++) {
          rings.push({
            radius: 0,
            maxRadius: Math.max(canvas.width, canvas.height),
            speed: 10 + i * 6,
            color: neonColors[(wave * 4 + i) % neonColors.length],
            lineWidth: 4 - i * 0.5,
            opacity: 1,
            delay: wave * 30 + i * 5,
            frame: 0
          });
        }
      }

      const sparks = [];
      const sparkCount = 72;
      for (let i = 0; i < sparkCount; i++) {
        const angle = (Math.PI * 2 / sparkCount) * i + (Math.random() * 0.15);
        const speed = Math.random() * 16 + 10;
        sparks.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: neonColors[Math.floor(Math.random() * neonColors.length)],
          opacity: 1,
          delay: Math.floor(Math.random() * 10),
          frame: 0,
          trail: []
        });
      }

      // Second wave of sparks slightly delayed
      for (let i = 0; i < 36; i++) {
        const angle = (Math.PI * 2 / 36) * i + 0.08;
        const speed = Math.random() * 20 + 14;
        sparks.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: neonColors[Math.floor(Math.random() * neonColors.length)],
          opacity: 1,
          delay: 20 + Math.floor(Math.random() * 10),
          frame: 0,
          trail: []
        });
      }

      function drawFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        rings.forEach(function(r) {
          if (r.frame < r.delay) { r.frame++; return; }
          r.radius += r.speed;
          r.opacity = Math.max(0, 1 - (r.radius / r.maxRadius) * 1.3);
          if (r.opacity > 0) {
            ctx.save();
            ctx.globalAlpha = r.opacity;
            ctx.strokeStyle = r.color;
            ctx.lineWidth = Math.max(0.5, r.lineWidth);
            ctx.shadowColor = r.color;
            ctx.shadowBlur = 28;
            ctx.beginPath();
            ctx.arc(cx, cy, r.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
        });

        sparks.forEach(function(s) {
          if (s.frame < s.delay) { s.frame++; return; }
          s.trail.push({ x: s.x, y: s.y });
          if (s.trail.length > 6) s.trail.shift();
          s.x += s.vx;
          s.y += s.vy;
          s.vx *= 0.95;
          s.vy *= 0.95;
          s.opacity -= 0.016;
          if (s.opacity > 0 && s.trail.length > 1) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, s.opacity);
            ctx.strokeStyle = s.color;
            ctx.lineWidth = 2.5;
            ctx.shadowColor = s.color;
            ctx.shadowBlur = 16;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(s.trail[0].x, s.trail[0].y);
            ctx.lineTo(s.x, s.y);
            ctx.stroke();
            ctx.restore();
          }
        });

        const anyVisible =
          rings.some(function(r) { return r.opacity > 0 || r.frame < r.delay; }) ||
          sparks.some(function(s) { return s.opacity > 0 || s.frame < s.delay; });

        if (anyVisible) {
          confettiAnimId = requestAnimationFrame(drawFrame);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      confettiAnimId = requestAnimationFrame(drawFrame);
    }

    function stopBurst() {
      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      const canvas = document.getElementById("celebration-canvas");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiParticles = [];
    }

    // ---- Check what to celebrate after a session is saved ----
    function checkCelebrations(exerciseId, duration, dataAfterSave) {
      const ex = dataAfterSave.exercises.find(function(e) { return e.id === exerciseId; });
      const exName = ex ? ex.name : "exercise";

      // Check personal best — is this the new best for this exercise?
      const pb = dataAfterSave.personalBests[exerciseId];
      if (pb && pb.duration === duration) {
        // Count how many sessions exist for this exercise — if only 1, it's the first ever
        const exSessions = dataAfterSave.sessions.filter(function(s) { return s.exerciseId === exerciseId; });
        if (exSessions.length === 1) {
          showCelebration("🏆", "First " + exName + "!", formatDuration(duration));
        } else {
          showCelebration("🏆", "Personal Best!", exName + " — " + formatDuration(duration));
        }
        return; // Only show one celebration at a time; PB takes priority
      }

      // Check streak milestones (per-exercise)
      const exStreak = dataAfterSave.streaks[exerciseId];
      if (exStreak && STREAK_MILESTONES.indexOf(exStreak.current) !== -1) {
        showCelebration("🔥", exStreak.current + " Day Streak!", exName);
        return;
      }

      // Check overall streak milestones
      const overall = dataAfterSave.streaks.overall;
      if (overall && STREAK_MILESTONES.indexOf(overall.current) !== -1) {
        showCelebration("⚡", overall.current + " Day Streak!", "Keep it up!");
        return;
      }
    }
  </script>

    recalculateStreaks();

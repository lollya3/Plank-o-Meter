<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Plank-o-Meter</title>

  <!-- ============================================
       STYLES
       ============================================ -->
  <style>
    /* ---- Base ---- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
      transition: background 0.3s, color 0.3s;
    }

    /* ---- Theme: Cool, lighter blue-green ---- */
    body {
      --bg: #16191F;
      --card-bg: #22262E;
      --text: #F0F4F8;
      --text-muted: #9AA5B1;
      --primary: #4FE0CB;
      --primary-text: #16191F;
      --accent: #7DD3F0;
      --secondary: #2C313A;
      --border: #2C313A;
    }

    /* ---- Layout ---- */
    .app-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .app-header h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .card p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* ---- Stats row ---- */
    .stat-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--secondary);
      border-radius: 12px;
      padding: 12px 8px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }

    /* ---- Buttons ---- */
    .primary-btn {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .secondary-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>Plank-o-Meter</h1>
  </header>

  <main>
    <section class="card">
      <h2>Step 1 Preview</h2>
      <p>This is a placeholder shell to confirm the data model loads correctly and to preview the color themes.</p>

      <div class="stat-row">
        <div class="stat">
          <span class="stat-label">Today's Best</span>
          <span class="stat-value">45s</span>
        </div>
        <div class="stat">
          <span class="stat-label">Streak</span>
          <span class="stat-value">3 🔥</span>
        </div>
        <div class="stat">
          <span class="stat-label">PB</span>
          <span class="stat-value">90s</span>
        </div>
      </div>

      <button class="primary-btn">Start Timer</button>
      <button class="secondary-btn">Export Data</button>
    </section>

    <section class="card">
      <h3>Data Check</h3>
      <p id="data-check">Loading...</p>
    </section>
  </main>

  <!-- ============================================
       DATA MODEL & LOCALSTORAGE LAYER
       ============================================
       All reading/writing to localStorage happens
       through these functions.

       Data shapes:

       exercises: [
         { id: "ex_...", name: "Plank", color: "#hex" }
       ]

       sessions: [
         { id: "s_...", exerciseId: "ex_...", date: "YYYY-MM-DD",
           timestamp: <ms>, duration: <seconds> }
       ]

       personalBests: {
         "<exerciseId>": { duration: <seconds>, date: "YYYY-MM-DD" }
       }

       streaks: {
         overall: { current: 0, longest: 0, lastDate: "YYYY-MM-DD" | null },
         "<exerciseId>": { current: 0, longest: 0, lastDate: "YYYY-MM-DD" | null }
       }
       ============================================ -->
  <script>
    const STORAGE_KEY = "plankometer_data";

    const DEFAULT_DATA = {
      exercises: [
        { id: "ex_plank", name: "Plank", color: "#FF6B35" },
        { id: "ex_wallsit", name: "Wall Sit", color: "#4ECDC4" },
        { id: "ex_hang", name: "Hang", color: "#FFD23F" }
      ],
      sessions: [],
      personalBests: {},
      streaks: {
        overall: { current: 0, longest: 0, lastDate: null }
      }
    };

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          saveData(DEFAULT_DATA);
          return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
        const parsed = JSON.parse(raw);
        return {
          exercises: parsed.exercises || DEFAULT_DATA.exercises,
          sessions: parsed.sessions || [],
          personalBests: parsed.personalBests || {},
          streaks: parsed.streaks || { overall: { current: 0, longest: 0, lastDate: null } }
        };
      } catch (err) {
        console.error("Failed to load data, using defaults:", err);
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch (err) {
        console.error("Failed to save data:", err);
        alert("Could not save data. Storage may be full.");
        return false;
      }
    }

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function generateId(prefix) {
      return `${prefix}_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
    }

    // ---- Export / Import ----

    function exportData() {
      const data = loadData();
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      const dateStr = getTodayString();
      a.download = `plankometer-backup-${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importData(jsonString) {
      try {
        const parsed = JSON.parse(jsonString);

        if (!parsed.exercises || !Array.isArray(parsed.exercises)) {
          throw new Error("Invalid file: missing exercises list");
        }
        if (!parsed.sessions || !Array.isArray(parsed.sessions)) {
          throw new Error("Invalid file: missing sessions list");
        }

        const confirmed = confirm(
          "This will replace ALL current data with the imported file. This cannot be undone. Continue?"
        );
        if (!confirmed) return false;

        saveData({
          exercises: parsed.exercises,
          sessions: parsed.sessions,
          personalBests: parsed.personalBests || {},
          streaks: parsed.streaks || { overall: { current: 0, longest: 0, lastDate: null } }
        });

        return true;
      } catch (err) {
        console.error("Import failed:", err);
        alert("Import failed: " + err.message);
        return false;
      }
    }
  </script>

  <!-- ============================================
       INIT
       ============================================ -->
  <script>
    // Verify data model loads correctly
    const data = loadData();
    document.getElementById('data-check').textContent =
      `Loaded ${data.exercises.length} exercises, ${data.sessions.length} sessions. ` +
      `Exercises: ${data.exercises.map(e => e.name).join(', ')}`;
  </script>

</body>
</html>
